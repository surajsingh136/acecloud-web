services:
  - type: web
    name: acecloud-web
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python webapp/app.py
    envVars:
      - key: ACEWEB_PIN
        sync: false
      - key: ACECLOUD_EMAIL
        sync: false
      - key: ACECLOUD_PASSWD
        sync: false
