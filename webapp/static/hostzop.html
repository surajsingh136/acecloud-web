<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hostzop Proxy Maker</title>
<link rel="stylesheet" href="/hostzop.css">
</head>
<body>

<header class="banner">
  <div class="banner-l">
    <span class="brand">HOSTZOP</span>
    <span class="brand2">PROXY MAKER &nbsp;|&nbsp; Dashboard</span>
  </div>
  <div class="banner-r">
    <select id="hz_acct" class="acctsel" title="Hostzop account"></select>
    <button id="btn_keys" class="btn ghosty">Keys</button>
    <span class="tag">cherrypick servers&nbsp;&nbsp;|&nbsp;&nbsp;apikey auto&nbsp;&nbsp;|&nbsp;&nbsp;bill 0 after delete</span>
  </div>
</header>

<main class="wrap">

  <section class="panel ctrl">
    <div class="row">
      <label>Name:</label>
      <input id="c_name" class="in" value="hzproxy">
      <label class="gap">Count:</label>
      <input id="c_count" class="in c-sm" type="number" min="1" max="100" value="1">
      <label class="gap">OS:</label>
      <select id="c_os" class="in">
        <option>Ubuntu</option>
        <option>CentOS</option>
        <option>Windows Server</option>
      </select>
      <label class="gap">Ver:</label>
      <select id="c_ver" class="in c-xs"></select>
    </div>

    <div class="row">
      <label>Template (snapshot):</label>
      <select id="c_tpl" class="in wide"></select>
    </div>

    <div class="row">
      <label>Server Class:</label>
      <select id="c_pool" class="in c-mid"></select>
      <label class="gap">Size:</label>
      <select id="c_size" class="in wide"></select>
    </div>

    <div class="row">
      <label>Proxy User:</label>
      <input id="c_user" class="in" value="ajay">
      <label class="gap">Proxy Pass:</label>
      <input id="c_pass" class="in" value="ajay">
      <label class="gap">Root Pass:</label>
      <input id="c_root" class="in" value="">
      <input id="c_net" class="in hidden" value="My Network">
      <input id="c_bill" class="in hidden" value="">
    </div>

    <div class="btns">
      <button id="btn_create" class="btn create">Create Proxies</button>
      <button id="btn_delall" class="btn del">Delete All (bill 0)</button>
      <button id="btn_snap" class="btn">Snapshot</button>
      <button id="btn_test" class="btn">Test Proxy</button>
      <button id="btn_open" class="btn">Open Output</button>
    </div>

    <div class="row">
      <label>Proxy test (ip:port:user:pass):</label>
      <input id="c_testline" class="in wide">
    </div>
  </section>

  <section class="panel">
    <div class="toolbar">
      <span id="stats" class="stats">Servers: --</span>
      <div class="tb-r">
        <button id="btn_refresh" class="btn sm">Refresh</button>
        <button id="btn_copyip" class="btn sm">Copy IP</button>
        <button id="btn_copyproxy" class="btn sm">Copy Proxy</button>
        <button id="btn_copyrdp" class="btn sm">Copy RDP Pass</button>
        <button id="btn_delsel" class="btn sm del">Delete Selected</button>
      </div>
    </div>
    <div class="tablewrap">
      <table id="srv">
        <thead>
          <tr>
            <th class="chk"></th><th>Name</th><th>IP</th><th>Status</th>
            <th>OS</th><th>Size</th><th>Proxy</th><th>Created</th>
          </tr>
        </thead>
        <tbody id="srvBody"></tbody>
      </table>
    </div>
  </section>

  <section class="logwrap">
    <div id="log" class="log"></div>
  </section>

</main>

<footer class="statusbar"><span id="balance">Balance: -- &nbsp;|&nbsp; Unpaid: --</span></footer>

<div id="modal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-head"><span id="modal-title">Title</span><button id="modal-x" class="btn sm">X</button></div>
    <div id="modal-body" class="modal-body"></div>
  </div>
</div>

<div id="toast" class="toast"></div>
<script src="/hostzop.js"></script>
</body>
</html>
