<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ACE Hub - All Sites</title>
<link rel="stylesheet" href="/all.css">
</head>
<body>
<header class="topbar">
  <img class="brandlogo" src="/logo.svg" alt="ACECLOUD">
  <div class="brandtxt">
    <div class="brandtitle">ACE HUB</div>
    <div class="brandsub">All your web tools in one place</div>
  </div>
  <div class="spacer"></div>
  <a class="home" href="/">Open Manager</a>
</header>

<main>
  <h2 class="sec">Sites</h2>
  <div id="sites" class="grid"></div>
  <button class="addsite" onclick="addPlaceholder()">+ Add website (coming soon)</button>
</main>

<div id="cfg" class="modal">
  <div class="box">
    <div class="hd">
      <img src="/logo.svg" class="mini" id="cfgLogo" alt="">
      <span id="cfgTitle">ACECLOUD - Configure</span>
      <button class="x" onclick="hide('cfg')">&times;</button>
    </div>
    <div class="bd">
      <p class="info">Enter the important details (login / API) for an account. The current
        (default) account keeps working and is never modified.</p>
      <div id="activeInfo" class="activeInfo"></div>
      <div id="acclist"></div>

      <div class="form">
        <h3 id="formTitle">Add account</h3>
        <label>Label</label>
        <input id="alabel" placeholder="e.g. Office">

        <div id="fieldsAce">
          <label>Email</label>
          <input id="aemail" placeholder="you@example.com">
          <label>Password</label>
          <input id="apass" type="password" placeholder="********">
          <label>Default region</label>
          <select id="aregion">
            <option value="ap-south-mum-2">Mumbai</option>
            <option value="ap-south-noi-1">Noida</option>
          </select>

          <button type="button" class="detectbtn" onclick="detect()">Detect required details (project &amp; networks)</button>
          <div id="detectBox" class="detectbox">
            <label>Project</label>
            <select id="projSel" onchange="renderNets()"></select>
            <div id="netBox"></div>
          </div>

          <details class="adv">
            <summary>Required IDs (auto-filled by Detect; edit only if needed)</summary>
            <label>Project ID</label>
            <input id="aproj" placeholder="project id">
            <label>Network ID - Mumbai</label>
            <input id="anetmum" placeholder="external network id (Mumbai)">
            <label>Network ID - Noida</label>
            <input id="anetnoi" placeholder="external network id (Noida)">
          </details>

          <label>API key (optional)</label>
          <input id="akey" placeholder="leave empty if none">
        </div>

        <div id="fieldsKey" style="display:none">
          <label>API key</label>
          <input id="akey2" placeholder="paste API key">
          <div id="fieldsHz" style="display:none">
            <label>Billing account ID (optional)</label>
            <input id="ahzbill" placeholder="billing account id">
            <label>Location (optional)</label>
            <input id="ahzloc" placeholder="e.g. chn01">
          </div>
          <div id="fieldsEx" style="display:none">
            <label>Zone ID (optional)</label>
            <input id="aexzone" placeholder="zone id">
            <label>Subnet ID (optional)</label>
            <input id="aexsub" placeholder="subnet id">
          </div>
          <div id="fieldsGc" style="display:none">
            <label>Project ID (optional)</label>
            <input id="agcproj" placeholder="auto-detect">
            <label>Region ID (optional)</label>
            <input id="agcreg" placeholder="108 (Mumbai)" value="108">
          </div>
        </div>

        <label>Note (optional)</label>
        <input id="anote" placeholder="">
        <label class="chk"><input type="checkbox" id="ause" checked> Use this account now</label>
        <div class="btns">
          <button class="ghost" onclick="resetForm()">Clear</button>
          <button class="primary" onclick="saveAccount()">Save account</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="/all.js"></script>
</body>
</html>
